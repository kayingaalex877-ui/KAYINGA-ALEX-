<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Shanitah Juice Company</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav aria-label="Main navigation">
    <a class="brand" href="index.html">
      <img src="images/orange-juice.jpg" alt="Glass of orange juice representing Shanitah Juice Company">
      <span>Shanitah Juice Company</span>
    </a>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="gallery.html">Gallery</a>
    <a href="services.html">Services</a>
  </nav>
  <h1>Juice Gallery</h1>
  <main class="gallery">
    <figure>
      <a href="index.html" aria-label="Return to Shanitah Juice Company home page">
        <img class="gallery-image" src="images/orange-juice.jpg" alt="A glass of fresh orange juice garnished with an orange slice.">
      </a>
      <figcaption>Fresh orange juice</figcaption>
    </figure>
    <figure>
      <img class="gallery-image" src="images/fresh-fruit.jpg" alt="Two ripe oranges with green leaves.">
      <figcaption>Fresh oranges</figcaption>
    </figure>
    <figure>
      <img class="gallery-image" src="images/berry-smoothie.jpg" alt="Colorful fruit smoothies in glass jars beside fresh greens.">
      <figcaption>Fruit smoothies</figcaption>
    </figure>
    <section class="gallery-media" aria-labelledby="media-heading">
      <h2 id="media-heading">Juice media</h2>
      <div class="media-grid">
        <div class="media-card">
          <h3>Juice preparation video</h3>
          <div class="juice-video-frame">
            <video controls preload="metadata" poster="images/orange-juice.jpg" aria-label="Juice-making video with audio">
              <source src="videos/juice-making.mp4" type="video/mp4">
              Your browser does not support HTML video.
            </video>
          </div>
        </div>
        <div class="media-card">
          <h3>Audio from the video</h3>
          <audio controls preload="none" aria-label="Audio from the juice-making video">
            <source src="videos/juice-making.mp4" type="audio/mp4">
            Your browser does not support HTML audio.
          </audio>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
